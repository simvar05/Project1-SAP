<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <title>Create Document</title>
    <link rel="stylesheet" href="/css/style.css" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="sidebar">
        <h2>Version Control</h2>
        <p style="color:#94a3b8; font-size:13px; margin-top:5px;">
            Document Management System
        </p>

        <a href="/dashboard">Dashboard</a>
        <a href="/documents" class="active">Documents</a>
    </div>

    <div class="main">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h1>Create Document</h1>
            <a href="/documents" class="btn">← Back</a>
        </div>

        <div class="form-card">
            <form onsubmit="createDoc(event)">

                <div class="form-group">
                    <label>Document Title</label>
                    <input type="text" name="title" placeholder="Enter document title..." required>
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" placeholder="Enter document description..."></textarea>
                </div>

                <div class="form-group">
                    <label>Initial Content</label>
                    <textarea name="content" class="large-textarea"
                              placeholder="Write the document content here..."></textarea>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Status</label>
                        <select name="status">
                            <option value="DRAFT">Draft</option>
                            <option value="PENDING">Pending Review</option>
                        </select>
                    </div>

                </div>

                <div style="display:flex; gap:15px; margin-top:30px;">
                    <button type="submit" class="btn btn-primary">
                        Create Document
                    </button>

                    <a href="/documents" class="btn btn-danger">
                        Cancel
                    </a>
                </div>

            </form>
        </div>

    </div>
</div>

<script>
    async function createDoc(e){
        e.preventDefault();

        const data = {
            id: 1,
            doc_id: Date.now(),
            document_content: document.querySelector('[name="content"]').value,
            name: document.querySelector('[name="title"]').value
        };

        try {
            const response = await fetch('/documents/creates', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error("Failed to create document");
            }

            alert("Document created successfully!");
            window.location.href = "/documents";

        } catch (err) {
            alert(err.message);
        }
    }
</script>

</body>
</html>
